name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: thriftage_test
          POSTGRES_PASSWORD: thriftage
          POSTGRES_USER: thriftage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U thriftage -d thriftage_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AI_STYLIST_ENABLED: 'false'
      DATABASE_URL: postgresql://thriftage:thriftage@localhost:5432/thriftage_test?schema=public
      EXPO_PUBLIC_API_URL: http://127.0.0.1:4000/api/v1
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci-placeholder
      EXPO_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_TELEMETRY_DISABLED: '1'
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci-placeholder
      SUPABASE_SECRET_KEY: sb_secret_ci-placeholder
      SUPABASE_URL: https://ci-placeholder.supabase.co
      TEST_DATABASE_URL: postgresql://thriftage:thriftage@localhost:5432/thriftage_test?schema=public
      TWILIO_ACCOUNT_SID: AC11111111111111111111111111111111
      TWILIO_API_KEY_SECRET: ci-restricted-key-placeholder
      TWILIO_API_KEY_SID: SK22222222222222222222222222222222
      TWILIO_VERIFY_SERVICE_SID: VA33333333333333333333333333333333
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan tracked files for secrets
        run: pnpm security:secrets

      - name: Check migration safety
        run: pnpm ci:migration-safety

      - name: Audit critical dependency vulnerabilities
        run: pnpm security:audit

      - name: Validate Prisma schema
        run: pnpm db:validate

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Apply test database migrations
        run: pnpm db:migrate:deploy

      - name: Verify least-privilege runtime database role
        run: pnpm supabase:verify-runtime-role:local

      - name: Test database constraints
        run: pnpm test:db

      - name: Build
        run: pnpm build

      - name: Scan generated artifacts for secrets
        run: pnpm security:artifacts

      - name: Check Expo dependencies and configuration
        run: pnpm mobile:doctor
