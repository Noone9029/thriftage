name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: thriftage_test
          POSTGRES_PASSWORD: thriftage
          POSTGRES_USER: thriftage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U thriftage -d thriftage_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://thriftage:thriftage@localhost:5432/thriftage_test?schema=public
      NEXT_TELEMETRY_DISABLED: '1'
      TEST_DATABASE_URL: postgresql://thriftage:thriftage@localhost:5432/thriftage_test?schema=public
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm db:validate

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Apply test database migrations
        run: pnpm db:migrate:deploy

      - name: Test database constraints
        run: pnpm test:db

      - name: Build
        run: pnpm build
