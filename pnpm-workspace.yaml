  - expo-modules-core@57.0.12 || 57.0.13
  - expo-modules-jsi@57.0.5
  - expo-dev-client@57.0.14 || 57.0.15
  - expo-dev-launcher@57.0.14 || 57.0.15
  - expo-dev-menu@57.0.14 || 57.0.15
  - expo-linking@57.0.7
  - expo-notifications@57.0.13 || 57.0.14
  - expo-updates@57.0.16 || 57.0.17
  - '@expo/config-plugins@57.0.9'
  - '@expo/config@57.0.9'
  - '@expo/image-utils@0.11.5'
  - '@expo/metro-file-map@57.0.2'
  - '@expo/require-utils@57.0.5'
