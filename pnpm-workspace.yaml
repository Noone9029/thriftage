packages:
  - apps/*
  - packages/*

allowBuilds:
  '@prisma/engines': true
  '@sentry/cli': true
  esbuild: true
  prisma: true
  sharp: true

catalog:
  typescript: ^6.0.3
  vitest: ^4.1.10
  zod: ^4.4.3

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.14 || 57.0.17'
  - '@expo/fingerprint@0.20.7 || 0.20.9'
  - '@expo/inline-modules@0.1.5'
  - '@expo/local-build-cache-provider@57.0.6 || 57.0.7'
  - '@expo/metro-config@57.0.8 || 57.0.9'
  - '@expo/prebuild-config@57.0.11 || 57.0.13'
  - expo-asset@57.0.10 || 57.0.13
  - expo-constants@57.0.10 || 57.0.13
  - expo-server@57.0.2
  - expo@57.0.12 || 57.0.15
  - '@expo/metro-runtime@57.0.9 || 57.0.12'
  - '@expo/ui@57.0.10 || 57.0.12'
  - expo-router@57.0.12 || 57.0.15
  - expo-image-picker@57.0.9 || 57.0.12
  - '@expo/router-server@57.0.7'
  - expo-file-system@57.0.5
  - expo-modules-core@57.0.12
  - expo-modules-jsi@57.0.5
  - expo-dev-client@57.0.14
  - expo-dev-launcher@57.0.14
  - expo-dev-menu@57.0.14
  - expo-linking@57.0.7
  - expo-notifications@57.0.13
  - expo-updates@57.0.16
